<section class="notifications">
  <h1>Notifications</h1>

  @if (loading()) {
    <div style="display: flex; flex-direction: column; gap: var(--s-3)">
      <div class="skeleton" style="height: 50px; width: 100%;"></div>
      <div class="skeleton" style="height: 50px; width: 100%;"></div>
      <div class="skeleton" style="height: 50px; width: 100%;"></div>
    </div>
  } @else {
    <ul>
      @for (notification of notifications(); track notification._id) {
        <li [class.unread]="!notification.readAt" (click)="markRead(notification)">
          <strong>{{ notification.type }}</strong>
          <span>{{ notification.createdAt | date: 'short' }}</span>
        </li>
      } @empty {
        <p>No notifications yet.</p>
      }
    </ul>
  }
</section>

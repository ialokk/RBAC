<section class="stack">
  <div class="section-head">
    <h1>All restaurants</h1>
    @if (!loading() && total()) {
      <span class="text-sm text-muted">{{ total() }} total</span>
    }
  </div>

  @if (loading()) {
    <app-skeleton-cards [count]="8" />
  } @else if (loadError()) {
    <app-empty-state
      icon="close"
      tone="error"
      title="We couldn't load restaurants"
      message="Please check your connection and try again."
      actionLabel="Retry"
      (action)="load()"
    />
  } @else if (!restaurants().length) {
    <app-empty-state icon="store" title="No restaurants yet" message="Check back soon — new kitchens are added regularly." />
  } @else {
    <div class="grid-auto">
      @for (restaurant of restaurants(); track restaurant._id) {
        <app-restaurant-card [restaurant]="restaurant" />
      }
    </div>

    @if (hasMore()) {
      <button type="button" class="btn btn-secondary" (click)="nextPage()">Load more</button>
    }
  }
</section>

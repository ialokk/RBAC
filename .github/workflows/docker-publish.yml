name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploying the pushed images to a real host/cluster is intentionally left as a manual or
  # host-specific step (docs/DEPLOYMENT.md §"CI/CD") — this repo has no live target environment or
  # deploy credentials to wire up, and Version 1 explicitly runs as a single Docker Compose host
  # (no Kubernetes/managed container platform), so "deploy" here means: SSH to the host, `docker
  # compose pull && docker compose up -d`, which only that host's operator can safely automate
  # with its own secrets.
